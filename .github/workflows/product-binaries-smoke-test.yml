# simplest possible smoke for now
name: helper smoke test

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths:
      - 'cmd/camber-helper/**'
      - 'pkg/camber-helper/**'
      - '.github/workflows/product-binaries-smoke-test.yml'

jobs:
  e2e-helper:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    env:
      # Ensure helper writes logs/sessions/trajectories inside the workspace
      XDG_STATE_HOME: ${{ github.workspace }}/.state

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          set -euo pipefail
          go build -tags=fts5 -o "camber-helper" ./cmd/camber-helper
          echo "HELPER_BIN=$PWD/camber-helper" >> "$GITHUB_ENV"

      # the simplest of smoke tests fow now: does it start without crashing
      - name: Run helper smoke test
        # shouldn't be slow
        timeout-minutes: 5
        run: |
          set -euo pipefail
          
          "$HELPER_BIN" \
            --help \
            2>&1 | tee helper-run.log
            
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: history-ubuntu
          path: |
            *-run.log
          retention-days: 7
