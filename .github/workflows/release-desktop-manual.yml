name: Release · Desktop

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release type
        required: true
        default: preview
        type: choice
        options: [preview, stable-patch, stable-minor, stable-major]
      helper_tag:
        description: Published immutable helper tag (helper/vM.m.p)
        required: true
        type: string
      version:
        description: Exact desktop version (required for first release)
        required: false
        type: string
      create_lineage:
        description: Bootstrap the desktop release lineage
        default: false
        type: boolean

permissions:
  contents: write
  packages: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.runtime.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify published helper
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          HELPER_TAG: ${{ inputs.helper_tag }}
        run: |
          set -euo pipefail
          bash scripts/download-helper-runtime.sh "$HELPER_TAG" "$RUNNER_TEMP/helper-runtime"
          echo "version=${HELPER_TAG#helper/v}" >> "$GITHUB_OUTPUT"
  release:
    needs: runtime
    uses: ./.github/workflows/release-desktop.yml
    with:
      release: ${{ inputs.release }}
      sync_versions: false
      helper_tag: ${{ inputs.helper_tag }}
      helper_version: ${{ needs.runtime.outputs.version }}
      version: ${{ inputs.version }}
      create_lineage: ${{ inputs.create_lineage }}
    secrets: inherit
