name: reusable-bazel-build

on:
  workflow_call:
    inputs:
      bazel_target:
        description: "Base Bazel target (e.g. //cmd/camber-helper:camber-helper). Cross targets are derived by appending _{goos}_{goarch}."
        type: string
        required: true
      binary_name:
        description: "Output binary name (e.g. camber-helper). Used for renaming and packaging."
        type: string
        required: true
      tag:
        description: "Version tag (e.g. pool/v1.2.3 or v1.2.3)"
        type: string
        required: false
      version:
        description: "Exact version string to embed instead of deriving one from tag"
        type: string
        required: false
      tag_prefix:
        description: "Prefix to strip from tag when embedding version (e.g. pool/ for pool/v1.2.3 → v1.2.3)"
        type: string
        required: false
        default: ""
      ref:
        description: "Exact source ref to build"
        type: string
        required: false
      sign_darwin:
        description: "Sign macOS binaries with Apple code signing"
        type: boolean
        required: false
        default: false
      embed_mobile_webui:
        description: "Build the mobile-remote UI bundle and copy it into the helper's webui embed dir before the Bazel build (camber-helper only)"
        type: boolean
        required: false
        default: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          # darwin/arm64: native on arm64 runner (Apple Silicon).
          - os: macos-latest
            goos: darwin
            goarch: arm64
            build_type: native

          # darwin/amd64: native on Intel runner.
          # Cross-compiling darwin/amd64 from arm64 is not possible with Bazel today:
          # - @local_config_cc on arm64 only generates a darwin_arm64 toolchain (no darwin_x86_64).
          # - The Zig toolchain (hermetic_cc_toolchain) doesn't bundle macOS SDK headers
          #   (e.g. resolv.h) — Apple's SDK is proprietary and can't be redistributed.
          # Until Bazel gains proper darwin cross-compilation support, a native Intel runner
          # is the only reliable way to produce CGO-enabled darwin/amd64 binaries.
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            build_type: native

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Install Bazelisk (macOS)
        if: runner.os == 'macOS'
        run: brew install bazelisk

      # The helper serves the mobile-remote UI from a bundle embedded at Go
      # compile time (pkg/camber-helper/internal/handler/remoteaccess/webui,
      # //go:embed via a glob'd embedsrcs). Only placeholders are committed, so
      # a release build must produce the bundle and copy it in BEFORE Bazel
      # compiles the binary — otherwise released helpers serve the "no mobile
      # UI bundle" fallback page to paired phones.
      - name: Setup pnpm for mobile UI embed
        if: inputs.embed_mobile_webui
        uses: ./.github/actions/ui-setup
        with:
          pnpm_install_args: "--filter @camber/mobile-remote..."

      - name: Embed mobile-remote UI bundle
        if: inputs.embed_mobile_webui
        shell: bash
        env:
          # The mobile-remote vite build (~6k modules) exceeds Node's default
          # ~2GB heap on the macos-latest runner.
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm --filter @camber/mobile-remote embed

      - name: Compute version tag
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="${{ env.TAG }}"
          PREFIX="${{ inputs.tag_prefix }}"
          if [ -n "$VERSION" ]; then
            CLEAN_TAG="$VERSION"
          elif [ -n "$PREFIX" ]; then
            STRIP="${PREFIX}v"
            CLEAN_TAG="${TAG#"${STRIP}"}"
          else
            CLEAN_TAG="${TAG#v}"
          fi
          echo "clean_tag=${CLEAN_TAG}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${{ inputs.binary_name }}-${{ matrix.goos }}-${{ matrix.goarch }}" >> "$GITHUB_OUTPUT"

      - name: Build and locate binary
        id: build
        shell: bash
        env:
          VERSION_TAG: ${{ steps.version.outputs.clean_tag }}
        run: |
          set -euo pipefail

          case "${{ matrix.build_type }}" in
            cross)
              # Optional Linux cross-compilation for helper development.
              # --config=ci_amd64 sets --platforms=linux_amd64 for the outer config,
              # but go_cross_binary applies its own platform transition so the
              # outer --platforms does not override the cross-compiled target.
              TARGET="${{ inputs.bazel_target }}_${{ matrix.goos }}_${{ matrix.goarch }}"
              BUILD_FLAGS="--config=ci_amd64 --config=publish"
              ;;
            native)
              # darwin/arm64: plain native build, no platform override.
              TARGET="${{ inputs.bazel_target }}"
              BUILD_FLAGS="--config=publish"
              ;;
          esac

          bazelisk build $BUILD_FLAGS "$TARGET"

          # cquery --output=files reliably returns the actual output file path
          # regardless of which platform subdirectory Bazel chose.
          BINARY_PATH=$(bazelisk cquery $BUILD_FLAGS "$TARGET" --output=files | head -1)
          echo "binary_path=${BINARY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Copy binary to dist/
        shell: bash
        run: |
          mkdir -p dist

          SUFFIX=""

          DEST="dist/${{ steps.version.outputs.archive_name }}${SUFFIX}"
          cp "${{ steps.build.outputs.binary_path }}" "${DEST}"
          chmod u+w "${DEST}"
          echo "BINARY_DEST=${DEST}" >> "${GITHUB_ENV}"
          echo "SUFFIX=${SUFFIX}" >> "${GITHUB_ENV}"

      - name: Sign macOS binary
        if: inputs.sign_darwin && matrix.goos == 'darwin'
        uses: ./.github/actions/sign-darwin-binary
        with:
          BINARY_PATH: ${{ env.BINARY_DEST }}
          ASC_ISSUER_ID: ${{ vars.APPLE_API_ISSUER }}
          ASC_KEY_ID: ${{ vars.APPLE_API_KEY }}
          MACOS_DEVID_P12_B64: ${{ secrets.MACOS_DEVID_P12_B64 }}
          MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}

      - name: Package tarball and checksum
        shell: bash
        run: |
          cd dist
          ARCHIVE="${{ steps.version.outputs.archive_name }}.tar.gz"
          BINARY="${{ steps.version.outputs.archive_name }}${{ env.SUFFIX }}"
          tar -czf "${ARCHIVE}" "${BINARY}"
          sha256sum "${ARCHIVE}" > "${{ steps.version.outputs.archive_name }}.checksum"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-${{ steps.version.outputs.archive_name }}
          path: |
            dist/${{ steps.version.outputs.archive_name }}.tar.gz
            dist/${{ steps.version.outputs.archive_name }}.checksum
          # GitHub Release assets are the durable copy. This artifact only
          # transports the build to publication and product packaging jobs.
          retention-days: 7
